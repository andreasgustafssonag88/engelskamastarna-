name: Publicera Engelskamästarna

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera paket
        run: npm install

      - name: Bygg spelet
        run: npm run build

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp spelet
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicera spelet
        id: deployment
        uses: actions/deploy-pages@v4
